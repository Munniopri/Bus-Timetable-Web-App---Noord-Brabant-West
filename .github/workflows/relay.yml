name: relay
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gtfs-realtime-bindings
      - run: python relay.py
      - run: |
          git config user.name "relay"
          git config user.email "relay@users.noreply.github.com"
          git add delays.json
          git commit -m "update delays" || exit 0
          git push
